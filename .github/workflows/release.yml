name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a prepared draft release
        required: true
        default: v0.1.1

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate version and draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag.' }
          [xml]$project = Get-Content -Raw src/Glint.App/Glint.App.csproj
          if ('v' + [string]$project.Project.PropertyGroup.Version -ne $env:RELEASE_TAG) { throw 'Version mismatch.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object tag_name -eq $env:RELEASE_TAG | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'Prepare a draft release first.' }
          if ($release.assets.Count -gt 0) { throw 'Expected a draft with no attachments.' }
      - name: Build portable package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Check portable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The full checks run on a Chinese Windows desktop before tagging.
          # WScript.Shell cannot create the harness's Chinese shortcut fixture on this English runner.
          $exe = Join-Path "artifacts/releases/$($env:RELEASE_TAG.Substring(1))/Glint-win-x64" 'Glint.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--background' -PassThru
          try {
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw 'Portable application exited during startup.' }
          } finally {
            Start-Process -FilePath $exe -ArgumentList '--exit' -Wait
            if (-not $process.WaitForExit(10000)) { throw 'Portable application did not exit cleanly.' }
          }
          if ($process.ExitCode -ne 0) { throw 'Portable application returned an error.' }
      - name: Upload, verify and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path 'artifacts/releases' $env:RELEASE_TAG.Substring(1)
          $files = @('Glint-win-x64.zip', 'SHA256SUMS.txt')
          gh release upload $env:RELEASE_TAG (Join-Path $root $files[0]) (Join-Path $root $files[1]) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object tag_name -eq $env:RELEASE_TAG | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'Unable to verify draft.' }
          foreach ($name in $files) {
            $local = Get-Item (Join-Path $root $name)
            $hash = (Get-FileHash $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $asset = $release.assets | Where-Object name -eq $name
            if (-not $asset -or $asset.state -ne 'uploaded' -or $asset.size -ne $local.Length -or $asset.digest -ne "sha256:$hash") {
              throw "Attachment verification failed: $name"
            }
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed.' }
